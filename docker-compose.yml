services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: fixeragent-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - LOG_LEVEL=INFO
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - chromadb
      - redis
    command: uvicorn fixeragent.api.main:app --host 0.0.0.0 --port 8000 --reload

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: fixeragent-chroma
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE

  redis:
    image: redis:7-alpine
    container_name: fixeragent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  chroma_data:
  redis_data:
