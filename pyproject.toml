[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixeragent"
version = "0.1.0"
description = "AI-powered home appliance repair assistant for non-technical users"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "FixerAgent Team"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "langgraph>=0.0.50",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "transformers>=4.41.0",
  "accelerate>=0.30.0",
  "torch>=2.3.0",
  "pillow>=10.3.0",
  "opencv-python>=4.9.0",
  "pytesseract>=0.3.10",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "click>=8.1.0",
  "loguru>=0.7.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
  "apscheduler>=3.10.4",
  "redis>=5.0.4",
  "prometheus-client>=0.20.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.5.0",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "jinja2>=3.1.4",
  "aiohttp>=3.9.5",
  "feedparser>=6.0.11",
  "scrapy>=2.11.2",
  "playwright>=1.44.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "black>=24.4.2",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.1",
  "httpx>=0.27.0",
]

[project.scripts]
fixer = "fixeragent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fixeragent"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
